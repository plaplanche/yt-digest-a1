[project]
name = "yt-digest-node"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "datamodel-code-generator>=0.85.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_digest_node"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
